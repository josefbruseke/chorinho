name: CI

on:
  push:
    branches: [main, dev, ci]
  pull_request:
    branches: [main, dev]

# Um PR que recebe vários pushes cancela os runs anteriores em vez de
# enfileirá-los. Sem isso a fila do Actions vira gargalo rapidamente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache do bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache de artefatos do forge
        uses: actions/cache@v4
        with:
          path: packages/foundry/out
          key: forge-${{ runner.os }}-${{ hashFiles('packages/foundry/contracts/**/*.sol') }}
          restore-keys: forge-${{ runner.os }}-

      - name: Formatação dos contratos
        run: bun run foundry:lint

      - name: Testes dos contratos
        run: bun run foundry:test

      # O deploy gera packages/nextjs/contracts/deployedContracts.ts, de que
      # o lint e o check-types do frontend dependem. Ele tambem e o unico teste
      # que o script de deploy tem: `forge test` nao o executa.
      #
      # Chama o forge direto, e nao `bun run chain` + `bun run deploy`. Aquele
      # caminho passa por um keystore que o `make chain` apaga e reimporta a
      # cada execucao, e falhava no runner com o nonce andando sozinho --
      # sempre, desde o primeiro commit do repositorio, e nunca na maquina de
      # quem programa. A chave abaixo e a primeira conta do anvil, publica e
      # conhecida por todo mundo que ja rodou um.
      #
      # `--slow` espera o recibo de cada transacao: sao nove contratos mais uma
      # duzia de concessoes de papel, e sem ele o forge despacha tudo de uma vez
      # e as transacoes chegam fora de ordem.
      - name: Subir anvil e fazer deploy
        working-directory: packages/foundry
        run: |
          anvil --silent &
          until cast block-number --rpc-url http://127.0.0.1:8545 > /dev/null 2>&1; do sleep 0.5; done
          forge script script/Deploy.s.sol \
            --rpc-url http://127.0.0.1:8545 \
            --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
            --broadcast --slow --ffi
          node scripts-js/generateTsAbis.js

      - name: Lint do frontend
        run: bun run next:lint --max-warnings=0

      - name: Tipos do frontend
        run: bun run next:check-types

      # O build pega o que lint e tsc não pegam (erros de Server/Client
      # Component, imports quebrados em tempo de bundle).
      - name: Build do frontend
        run: bun run next:build
