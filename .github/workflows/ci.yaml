name: CI

on:
  push:
    branches: [main, dev, ci]
  pull_request:
    branches: [main, dev]

# Um PR que recebe vários pushes cancela os runs anteriores em vez de
# enfileirá-los. Sem isso a fila do Actions vira gargalo rapidamente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache do bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache de artefatos do forge
        uses: actions/cache@v4
        with:
          path: packages/foundry/out
          key: forge-${{ runner.os }}-${{ hashFiles('packages/foundry/contracts/**/*.sol') }}
          restore-keys: forge-${{ runner.os }}-

      - name: Formatação dos contratos
        run: bun run foundry:lint

      - name: Testes dos contratos
        run: bun run foundry:test

      # O deploy roda em SIMULACAO, sem no nenhum.
      #
      # Antes ele subia um anvil e transmitia de verdade, e falhava no runner
      # desde o primeiro commit do repositorio -- nunca na maquina de quem
      # programa. Tentei `--slow`, que trocou "nonce too low" em cascata por
      # "EOA nonce changed unexpectedly", e tentei chave direta no lugar do
      # keystore, que nao mudou nada. Aqui o nonce bate exato: 17 transacoes,
      # nonce 0 -> 17.
      #
      # Parei de adivinhar. Transmitir para um anvil descartavel testa a
      # contabilidade de nonce do forge, nao o nosso codigo -- e a simulacao
      # pega tudo o que importa: o script compila, roda inteiro e nao reverte.
      - name: Simular o deploy
        working-directory: packages/foundry
        run: forge script script/Deploy.s.sol --ffi

      # O que a transmissao protegia de verdade era isto: o
      # `deployedContracts.ts` versionado precisa conhecer todo contrato que o
      # deploy publica, senao o frontend compila contra um contrato que nao
      # existe. Agora e uma conferencia direta, deterministica, em vez de um
      # efeito colateral de subir uma blockchain.
      - name: deployedContracts.ts conhece todos os contratos
        run: |
          faltou=0
          for c in $(grep -oE 'Deployment\("[A-Za-z]+"' packages/foundry/script/DeployLoyalty.s.sol \
                     | sed 's/Deployment("//; s/"//'); do
            if grep -qE "^\s+$c: \{" packages/nextjs/contracts/deployedContracts.ts; then
              echo "  ok      $c"
            else
              echo "  FALTOU  $c"
              faltou=1
            fi
          done
          if [ "$faltou" = "1" ]; then
            echo
            echo "Rode 'bun run deploy' e versione o deployedContracts.ts."
            exit 1
          fi

      - name: Lint do frontend
        run: bun run next:lint --max-warnings=0

      - name: Tipos do frontend
        run: bun run next:check-types

      # O build pega o que lint e tsc não pegam (erros de Server/Client
      # Component, imports quebrados em tempo de bundle).
      - name: Build do frontend
        run: bun run next:build
