name: CI

on:
  push:
    branches: [main, dev, ci]
  pull_request:
    branches: [main, dev]

# Um PR que recebe vários pushes cancela os runs anteriores em vez de
# enfileirá-los. Sem isso a fila do Actions vira gargalo rapidamente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache do bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Substitui, com simetria, a conferência que morreu junto com os
      # contratos ("o deployedContracts.ts conhece todo contrato publicado?").
      # Aquela impedia o frontend de compilar contra um contrato inexistente;
      # esta impede a blockchain de voltar por um import distraído.
      - name: Nenhum resquício de web3
        run: |
          padrao='wagmi|viem|@rainbow-me|@privy-io|@scaffold-ui|scaffold-eth|deployedContracts|services/relayer|services/web3'
          if grep -rInE "$padrao" app components services utils hooks \
               --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.json' \
               --exclude-dir=node_modules --exclude-dir=.next; then
            echo
            echo "A blockchain foi removida em M8. Os padrões acima não podem voltar."
            exit 1
          fi
          echo "  ok  nenhuma referência a web3"

      - name: Lint do frontend
        run: bun run next:lint --max-warnings=0

      - name: Tipos do frontend
        run: bun run next:check-types

      # O build pega o que lint e tsc não pegam (erros de Server/Client
      # Component, imports quebrados em tempo de bundle).
      - name: Build do frontend
        run: bun run next:build
